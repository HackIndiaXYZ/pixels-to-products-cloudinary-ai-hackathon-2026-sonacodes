databases:
  - name: wardrobeai-db
    databaseName: wardrobeai
    user: wardrobeai
    plan: 0.1c-256mb
    region: oregon

services:
  - type: web
    name: wardrobeai-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wardrobeai-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://wardrobeai-frontend.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: wardrobeai-frontend
    runtime: static
    rootDir: wardrobeAI
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: wardrobeai-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME